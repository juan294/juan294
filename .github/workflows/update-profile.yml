name: Update profile stats

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Render current profile statistics
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            export ACTIVITY_MONTH_OFFSET=1
          fi
          python scripts/render_profile.py
      - name: Commit changed statistics
        run: |
          if [[ -z "$(git status --short -- dark_mode.svg light_mode.svg)" ]]; then
            echo "Profile statistics are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dark_mode.svg light_mode.svg
          git commit -m "chore: refresh profile stats"
          git push
